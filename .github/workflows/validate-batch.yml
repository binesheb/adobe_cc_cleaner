name: Validate batch helper

on:
  push:
    paths:
      - 'cccleaner.bat'
      - '.github/workflows/validate-batch.yml'
  pull_request:
    paths:
      - 'cccleaner.bat'
      - '.github/workflows/validate-batch.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify bundled cleaner is present
        shell: pwsh
        run: |
          if (-not (Test-Path 'AdobeCreativeCloudCleanerTool.exe')) {
            throw 'Bundled cleaner executable is missing.'
          }
      - name: Validate destructive commands are not hidden
        shell: pwsh
        run: |
          $content = Get-Content 'cccleaner.bat' -Raw
          foreach ($command in 'takeown', 'icacls', 'del /f /q', 'rmdir /s /q', '--removeAll=ALL') {
            if ($content -notmatch [regex]::Escape($command)) {
              throw "Expected command missing: $command"
            }
          }
      - name: Verify elevation guard precedes cleanup
        shell: pwsh
        run: |
          $content = Get-Content 'cccleaner.bat' -Raw
          $guard = $content.IndexOf('net session', [System.StringComparison]::OrdinalIgnoreCase)
          $exit = $content.IndexOf('exit /b 1', [System.StringComparison]::OrdinalIgnoreCase)
          $cleanup = $content.IndexOf('takeown', [System.StringComparison]::OrdinalIgnoreCase)
          if ($guard -lt 0 -or $exit -lt 0 -or $cleanup -lt 0) {
            throw 'Elevation guard or cleanup command is missing.'
          }
          if ($guard -gt $cleanup -or $exit -gt $cleanup) {
            throw 'Elevation failure path must occur before destructive cleanup.'
          }
